<!-- ═══════════ RUGBY VICE — no un planeta: la cancha, con cosas pasando encima ═══════════ -->
<style id="rv-style">
  #rv{ position:fixed; inset:0; z-index:975; display:none; background:#04070A; overflow:hidden;
    font-family:'Montserrat',system-ui,sans-serif; color:#e8f4f8; }
  #rv.open{ display:block; }
  #rv-cv{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .rv-top{ position:absolute; left:0; right:0; top:0; z-index:3; display:flex; align-items:center; gap:10px;
    padding:14px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:linear-gradient(#04070AE8,#04070A00); pointer-events:none; }
  .rv-top > *{ pointer-events:auto; }
  .rv-top b{ font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:3px; line-height:1; font-weight:400; }
  .rv-top b em{ font-style:normal; color:#00F0FF; }
  .rv-top i{ font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:3px; color:#4a5a66; font-style:normal; }
  .rv-x{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:2px;
    color:#04070A; background:#e8f4f8; border:none; border-radius:3px; padding:11px 15px; cursor:pointer; min-height:44px; }
  .rv-tabs{ position:absolute; left:0; right:0; bottom:0; z-index:3; display:flex; gap:6px; overflow-x:auto;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(#04070A00,#04070AE8 40%); -webkit-overflow-scrolling:touch; }
  .rv-t{ flex:0 0 auto; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:2px;
    color:#8aa0aa; background:transparent; border:1px solid #1e3038; border-radius:3px;
    padding:11px 14px; cursor:pointer; min-height:44px; }
  .rv-t.on{ background:#00F0FF; color:#04070A; border-color:#00F0FF; font-weight:700; }
  .rv-hud{ position:absolute; left:14px; top:74px; z-index:3; font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:1px; color:#8aa0aa; line-height:2; pointer-events:none; }
  .rv-hud b{ color:#00F0FF; font-weight:700; }
  .rv-modo{ position:absolute; right:14px; top:74px; z-index:3; display:flex; flex-direction:column; gap:6px; }
  .rv-m{ font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:2px; color:#8aa0aa;
    background:#0a1218CC; border:1px solid #1e3038; border-radius:3px; padding:10px 13px;
    cursor:pointer; min-height:44px; min-width:96px; text-align:center; }
  .rv-m.on{ background:#00F0FF; color:#04070A; border-color:#00F0FF; font-weight:700; }
  .rv-panel{ position:absolute; inset:0; z-index:6; display:none; background:#04070AF5; overflow-y:auto;
    -webkit-overflow-scrolling:touch; }
  .rv-panel.show{ display:block; }
  .rp-w{ max-width:680px; margin:0 auto; padding:88px 18px calc(96px + env(safe-area-inset-bottom,0px)); }
  .rp-eye{ font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:4px; color:#4a5a66; margin-bottom:8px; }
  .rp-t{ font-family:'Bebas Neue',sans-serif; font-size:44px; letter-spacing:2px; line-height:.95;
    margin:0 0 14px; font-weight:400; }
  .rp-t em{ font-style:normal; color:#00F0FF; }
  .rp-h{ font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:4px; color:#4a5a66;
    margin:24px 0 10px; border-bottom:1px solid #14222a; padding-bottom:7px; }
  .rp-card{ background:#0a1218; border:1px solid #14222a; border-radius:6px; padding:14px 15px; margin-bottom:9px; }
  .rp-card b{ display:block; font-size:14px; font-weight:800; margin-bottom:4px; }
  .rp-card i{ display:block; font-style:normal; font-family:'JetBrains Mono',monospace; font-size:9px;
    letter-spacing:1px; color:#4a5a66; margin-bottom:6px; }
  .rp-card p{ margin:0; font-size:12.5px; line-height:1.7; color:#8aa0aa; }
  .rp-in,.rp-ta{ width:100%; background:#0a1218; border:1px solid #1e3038; border-radius:4px;
    color:#e8f4f8; font:400 13px 'JetBrains Mono',monospace; padding:12px; min-height:46px; margin-bottom:9px; }
  .rp-ta{ min-height:80px; line-height:1.7; resize:vertical; font-family:'Montserrat',sans-serif; }
  .rp-in:focus-visible,.rp-ta:focus-visible{ outline:2px solid #00F0FF; outline-offset:1px; }
  .rp-b{ background:#00F0FF; color:#04070A; border:none; border-radius:4px; padding:13px 17px;
    font:700 11px 'JetBrains Mono',monospace; letter-spacing:2px; cursor:pointer; min-height:46px; }
  .rp-b2{ background:transparent; border:1px solid #1e3038; color:#8aa0aa; border-radius:4px;
    padding:12px 15px; font:400 10px 'JetBrains Mono',monospace; letter-spacing:1px; cursor:pointer; min-height:46px; }
  .rp-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .rp-note{ font-size:11px; line-height:1.75; color:#4a5a66; border-left:2px solid #14222a;
    padding-left:11px; margin:14px 0 0; }
  .rp-bar{ height:8px; background:#14222a; border-radius:4px; overflow:hidden; margin-top:8px; }
  .rp-bar > div{ height:100%; background:#00F0FF; }
  @media(prefers-reduced-motion:reduce){ #rv *{ animation:none !important; transition:none !important; } }
</style>
<div id="rv" role="dialog" aria-modal="true" aria-label="Rugby Vice">
  <canvas id="rv-cv"></canvas>
  <div class="rv-top"><b>RUGBY <em>VICE</em></b><i>LA CANCHA VIVE · TOCÁ EL MODO</i>
    <button class="rv-x" id="rv-close">✕</button></div>
  <div class="rv-hud" id="rv-hud"></div>
  <div class="rv-modo" id="rv-modo"></div>
  <div class="rv-tabs" id="rv-tabs"></div>
  <div class="rv-panel" id="rv-p"></div>
</div>
