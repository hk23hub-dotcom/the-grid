<script>
// ═══ BACKROOMS v2 — se baja, se sufre, se adivina; y el dueño sale apretando el reloj ═══
(function(){
  function esperar(){ if(!window.Backrooms || !document.getElementById('backrooms')) return setTimeout(esperar,400); armar(); }
  esperar();
  function armar(){
    const B=window.Backrooms, $=id=>document.getElementById(id);
    const room=$('backrooms');
    const log=(a,b)=>{ try{ (window.hkLog||function(){})(a,b); }catch(e){} };
    const tier=()=>{ try{ return JSON.parse(localStorage.getItem('hk23_tier'))||'visita'; }catch(e){ return 'visita'; } };
    const redMot=matchMedia('(prefers-reduced-motion: reduce)').matches;

    // piezas nuevas del escenario
    if(!$('br-white')){ const w=document.createElement('div'); w.id='br-white'; room.appendChild(w); }
    if(!$('br-piso')){ const p=document.createElement('div'); p.id='br-piso'; room.appendChild(p); }
    B.piso=1;

    // ── el trauma del cambio ──
    let AC=null;
    function golpe(){ try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      const o=AC.createOscillator(), g=AC.createGain();
      o.frequency.value=62+Math.random()*18; o.type='sine';
      g.gain.setValueAtTime(0.001,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.11,AC.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.5);
      o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+0.55);
    }catch(e){} }
    const FRASES=['no mires atrás.','eso no era una puerta.','acá abajo el tiempo debe plata.',
      'alguien anotó tu nombre.','las paredes te escucharon.','el zumbido sabe dónde estás.',
      'ese pasillo no estaba ayer.','...¿escuchaste eso? nosotros también.'];
    function trauma(msg){
      golpe();
      if(!redMot){ room.classList.remove('br-trauma'); void room.offsetWidth; room.classList.add('br-trauma'); }
      const w=$('br-white'); w.style.opacity='0.9'; setTimeout(()=>w.style.opacity='0', 90);
      const m=$('br-msg'); if(m){ m.style.opacity='1';
        m.textContent=msg||FRASES[Math.floor(Math.random()*FRASES.length)];
        setTimeout(()=>{ if(m) m.style.opacity='0'; }, 2600); }
    }

    // ── entidades rondando: cruzan, se paran a mirarte, y en lo hondo hay ojos ──
    let entTimer=null;
    function unaEntidad(){
      if(!room.classList.contains('open')) return;
      if(room.querySelectorAll('.br-ent').length>=3) return;
      const e=document.createElement('div'); e.className='br-ent';
      const der=Math.random()<0.5, esc=0.6+Math.random()*0.9;
      e.style.transform='scale('+esc+')';
      e.style.left= der? '-40px':'calc(100vw + 40px)';
      room.appendChild(e);
      requestAnimationFrame(()=>{ e.style.opacity=String(0.35+Math.random()*0.4);
        const dur=(redMot?0:6000+Math.random()*7000);
        e.style.transition='opacity .5s, left '+(dur||1)+'ms linear';
        e.style.left= der? 'calc(100vw + 40px)':'-40px'; });
      // a veces se frena en seco a mirarte
      if(Math.random()<0.35) setTimeout(()=>{ if(!e.parentNode) return;
        const li=e.getBoundingClientRect().left; e.style.transition='opacity .3s'; e.style.left=li+'px';
        trauma('...te vio.');
        setTimeout(()=>{ e.style.opacity='0'; setTimeout(()=>e.remove(),600); }, 900+Math.random()*900);
      }, 1500+Math.random()*3000);
      setTimeout(()=>e.remove(), 15000);
    }
    function ojos(){
      if(B.piso<3 || !room.classList.contains('open')) return;
      const o=document.createElement('div'); o.className='br-ojos';
      o.style.left=(6+Math.random()*80)+'vw'; o.style.top=(30+Math.random()*40)+'vh';
      o.innerHTML='<i></i><i></i>';
      o.onclick=()=>{ o.remove(); trauma('parpadeaste primero.'); };
      room.appendChild(o); setTimeout(()=>o.remove(), 12000);
    }
    function arrancarEntidades(){
      clearInterval(entTimer);
      entTimer=setInterval(()=>{ if(Math.random()<0.7) unaEntidad(); if(Math.random()<0.30) ojos(); },
        Math.max(2400, 7000-B.piso*900));
    }

    // ── acertijos: la terminal pregunta distinto cada vez ──
    const ACERTIJOS=[
      ['NOT GIVEN. ¿ENTONCES QUÉ?', ['taken','toma','tomado','se toma']],
      ['¿CUÁNTOS LO SABEN?', ['23','veintitres','veintitrés']],
      ['EL ___ NO PREGUNTA. AGARRA.', ['buho','búho','el buho','owl']],
      ['LO QUE VALE NO SE PIDE. SE ___', ['toma','agarra','taken']],
      ['H K ___ — COMPLETÁ LA CLAVE DEL UNIVERSO', ['23','veintitres','veintitrés']]
    ];

    // ── bromas: no todas las puertas dicen la verdad ──
    const BROMAS=[
      br=>{ trauma('jaja no. mismo nivel.'); },
      br=>{ br.level=Math.max(0,br.level-1); $('br-level').textContent=br.level;
            trauma('esta puerta te DEVOLVIÓ. nivel '+br.level+'.'); },
      br=>{ br.bajar(true); trauma('el piso opinó distinto.'); },
      br=>{ const t=$('br-time'); if(t){ const v=t.textContent; t.textContent='66:60';
            setTimeout(()=>{ if(t.textContent==='66:60') t.textContent=v; },2000); }
            trauma('el reloj también miente.'); },
      br=>{ trauma('1.4K SE ESTÁN RIENDO DE VOS AHORA MISMO.'); }
    ];

    // ── bajar un piso ──
    B.bajar=function(silencio){
      this.piso=Math.min(9,(this.piso||1)+1);
      room.setAttribute('data-piso', String(Math.min(5,this.piso)));
      $('br-piso').textContent='PISO −'+this.piso;
      this.level++; $('br-level').textContent=this.level;
      if(!silencio) trauma('PISO −'+this.piso+'. ACÁ EL ZUMBIDO ES MÁS GRAVE.');
      log('backrooms','bajó al piso -'+this.piso);
      arrancarEntidades(); this.buildRoom();
    };

    // ── la sala, reconstruida entera ──
    B.buildRoom=function(){
      document.querySelectorAll('.br-door,.br-light,.br-graffiti,.br-shadow,.br-trap,.br-ojos').forEach(n=>n.remove());
      $('br-terminal').style.display='none'; $('br-exit').style.display='none';
      const nDoors=2+Math.floor(Math.random()*3), nLights=Math.max(1,4-Math.floor(this.piso/2));
      for(let i=0;i<nLights;i++){ const l=document.createElement('div'); l.className='br-light';
        l.style.left=(8+Math.random()*84)+'vw'; l.style.animationDelay=(Math.random()*6)+'s'; room.appendChild(l); }
      const CLUES=['NO SE PIDE','NADIE TE LO VA A DAR','EL BÚHO NO PREGUNTA. AGARRA.','NOT GIVEN.',
        '23 LO SABE','LA TERMINAL ESCUCHA','MANTENÉ APRETADO EL TIEMPO','EL DUEÑO NO CAMINA','MÁS ABAJO HAY MÁS'];
      if(Math.random()<0.55){ const g=document.createElement('div'); g.className='br-graffiti';
        g.textContent=CLUES[Math.floor(Math.random()*CLUES.length)];
        g.style.left=(8+Math.random()*66)+'vw'; g.style.top=(24+Math.random()*28)+'vh';
        g.style.transform='rotate('+(Math.random()*10-5).toFixed(1)+'deg)'; room.appendChild(g); }
      if(Math.random()<0.28){ const bo=$('br-blackout'); if(bo){ bo.style.opacity='0.94';
        setTimeout(()=>bo.style.opacity='0', 700+Math.random()*1100); } }
      // la escalera que baja (más común mientras más hondo estás)
      if(Math.random()<0.22+this.piso*0.04){
        const t=document.createElement('div'); t.className='br-trap';
        t.style.left=(12+Math.random()*70)+'vw';
        t.setAttribute('role','button'); t.setAttribute('aria-label','Bajar un piso');
        t.onclick=()=>B.bajar(); room.appendChild(t);
      }
      const hasTerminal=Math.random()<0.22 || this.level>=6;
      for(let i=0;i<nDoors;i++){
        const d=document.createElement('div'); d.className='br-door';
        d.style.left=(10+i*(80/nDoors)+Math.random()*8)+'vw';
        d.onclick=()=>{
          if(Math.random()<0.20){ BROMAS[Math.floor(Math.random()*BROMAS.length)](this); this.buildRoom(); return; }
          this.level++; $('br-level').textContent=this.level;
          $('br-sector').textContent=String.fromCharCode(65+Math.floor(Math.random()*6))+'-'+(1+Math.floor(Math.random()*9));
          trauma(); this.buildRoom();
        };
        room.appendChild(d);
      }
      if(hasTerminal){
        const term=$('br-terminal'); term.style.display='block';
        let q=term.querySelector('.br-q');
        if(!q){ q=document.createElement('div'); q.className='br-q'; term.insertBefore(q, term.firstChild); }
        const rid=ACERTIJOS[Math.floor(Math.random()*ACERTIJOS.length)];
        q.textContent='› '+rid[0]; B._rid=rid[1];
        const inp=$('br-answer'); inp.value=''; $('br-error').textContent='';
        inp.onkeydown=(e)=>{
          if(e.key!=='Enter') return;
          const a=inp.value.toLowerCase().trim();
          if(B._rid.some(x=>a.includes(x))){
            term.style.display='none'; log('backrooms','acertó en nivel '+this.level);
            const ex=$('br-exit'); ex.style.display='block';
            $('br-msg').style.opacity='1';
            $('br-msg').textContent='La puerta estuvo siempre. CRUZALA ANTES DE QUE CAMBIE DE OPINIÓN.';
            ex.onclick=()=>this.exit(true);
            setTimeout(()=>{ if(ex.style.display==='block' && room.classList.contains('open')){
              ex.style.display='none'; this.level+=1; $('br-level').textContent=this.level;
              trauma('Dudaste. La puerta se fue.'); this.buildRoom(); } }, 6500);
          } else { $('br-error').textContent='RESPUESTA RECHAZADA. LA TERMINAL SE APAGA.';
            log('backrooms','falló el acertijo en nivel '+this.level);
            setTimeout(()=>{ this.level+=2; $('br-level').textContent=this.level; trauma(); this.buildRoom(); },1200); }
        };
        setTimeout(()=>inp.focus(),300);
      }
    };

    // enter/exit: engancho piso y entidades sin perder lo original
    const enter0=B.enter.bind(B), exit0=B.exit.bind(B);
    B.enter=function(reason){ this.piso=1; room.setAttribute('data-piso','1');
      enter0(reason); $('br-piso').textContent='PISO −1'; arrancarEntidades(); };
    B.exit=function(escaped){ clearInterval(entTimer);
      document.querySelectorAll('.br-ent,.br-ojos').forEach(n=>n.remove());
      room.removeAttribute('data-piso'); exit0(escaped); };

    // ── LA SALIDA DEL DUEÑO: mantené apretado el reloj 1.2s ──
    const reloj=$('br-time');
    if(reloj){
      reloj.style.cssText+=';pointer-events:auto;cursor:pointer;min-width:44px;min-height:24px;display:inline-block';
      let hold=null;
      const abajo=()=>{ hold=setTimeout(()=>{
        if(tier()==='socio'){ trauma('EL DUEÑO NO CAMINA. EL DUEÑO SALE.');
          log('backrooms','salida del dueño'); setTimeout(()=>B.exit(false),450); }
        else { B.level++; $('br-level').textContent=B.level;
          trauma('¿Y VOS QUÉ APRETÁS? CAMINÁ.'); B.buildRoom(); }
      },1200); };
      const arriba=()=>{ clearTimeout(hold); hold=null; };
      reloj.addEventListener('pointerdown',abajo);
      reloj.addEventListener('pointerup',arriba);
      reloj.addEventListener('pointercancel',arriba);
      reloj.addEventListener('pointerleave',arriba);
    }
    B.dueño=()=>{ if(tier()==='socio'){ B.exit(false); return true; } return false; };
    B.v2=true;
  }
})();
</script>
