<style id="cvx-style">
  #cw .cvx-panel{ position:absolute; inset:64px 0 0 0; z-index:5; overflow-y:auto; display:none;
    -webkit-overflow-scrolling:touch; padding:20px 16px calc(110px + env(safe-area-inset-bottom,0px));
    background:#08080C; font-family:'Space Mono',ui-monospace,monospace; color:#E6E4DE; }
  #cw .cvx-panel.show{ display:block; }
  .cvx-w{ max-width:760px; margin:0 auto; }
  .cvx-eye{ font-size:8px; letter-spacing:4px; color:#6a6a78; margin-bottom:8px; }
  .cvx-t{ font-family:'Space Grotesk',system-ui,sans-serif; font-weight:900; font-size:30px;
    line-height:1.02; letter-spacing:-.8px; margin:0 0 6px; }
  .cvx-t em{ font-style:italic; color:#F7931A; }
  .cvx-sub{ font-size:12px; line-height:1.75; color:#9a9aa8; margin:0 0 20px; max-width:56ch; }
  .cvx-h{ font-size:8px; letter-spacing:4px; color:#6a6a78; margin:22px 0 9px;
    border-bottom:1px solid #1c1c26; padding-bottom:7px; }
  .cvx-in,.cvx-ta{ width:100%; background:#0e0e14; border:1px solid #23232e; border-radius:6px;

  .cvx-ta{ min-height:104px; line-height:1.7; resize:vertical; }
  .cvx-in:focus-visible,.cvx-ta:focus-visible{ outline:2px solid #F7931A; outline-offset:1px; }
  .cvx-b{ background:#F7931A; color:#08080C; border:none; border-radius:6px; padding:13px 17px;
    font:700 11px 'Space Mono',monospace; letter-spacing:2px; cursor:pointer; min-height:46px; }
  .cvx-b[disabled]{ opacity:.5; cursor:progress; }
  .cvx-b2{ background:transparent; border:1px solid #23232e; color:#9a9aa8; border-radius:6px;
    padding:12px 15px; font:400 10px 'Space Mono',monospace; letter-spacing:1px; cursor:pointer; min-height:46px; }
  .cvx-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .cvx-out{ white-space:pre-wrap; line-height:1.8; font-size:12.5px; color:#d2d2dc; background:#0b0b11;
    border:1px solid #1c1c26; border-left:3px solid #F7931A; border-radius:6px; padding:16px; margin-top:14px; }
  .cvx-out.err{ border-left-color:#FF5B4A; color:#ff9a86; }
  .cvx-card{ background:#0e0e14; border:1px solid #1c1c26; border-radius:8px; padding:14px 15px; margin-bottom:10px; }
  .cvx-card b{ display:block; font-size:13px; color:#E6E4DE; margin-bottom:5px; }
  .cvx-card i{ font-style:normal; font-size:11.5px; line-height:1.7; color:#9a9aa8; }
  .cvx-chk{ display:flex; gap:11px; align-items:flex-start; padding:12px 0; border-bottom:1px solid #15151d; cursor:pointer; }
  .cvx-chk input{ width:22px; height:22px; margin-top:1px; accent-color:#F7931A; flex:0 0 auto; }
  .cvx-chk span{ font-size:12px; line-height:1.65; color:#c2c2ce; }
  .cvx-chk.malo span{ color:#ff9a86; }
  .cvx-warn{ background:#1a0f0c; border:1px solid #4a2216; border-radius:6px; padding:13px 14px;
    font-size:11.5px; line-height:1.75; color:#ffb9a6; margin:14px 0; }
  .cvx-ag{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:11px; }
  .cvx-ag button{ font-size:9px; letter-spacing:1px; background:transparent; border:1px solid #23232e;
    color:#8a8a98; border-radius:5px; padding:11px 12px; cursor:pointer; min-height:44px; }
  .cvx-ag button.on{ background:#F7931A; color:#08080C; border-color:#F7931A; font-weight:700; }
  @media(max-width:560px){ .cvx-t{ font-size:23px; } #cw .cvx-panel{ inset:96px 0 0 0; } }
  @media(prefers-reduced-motion:reduce){ #cw .cvx-panel *{ animation:none !important; transition:none !important; } }
</style>
