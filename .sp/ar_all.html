<script>
// ═══ HK23ART — la pieza en 3D ocupa la pantalla entera. El mundo ES la obra. ═══
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const log=(a,b)=>{ try{ (window.hkLog||function(){})(a,b); }catch(e){} };

  // tu arte no es todo lo mismo
  const CATS=[['todo','TODO'],['madera','MADERA'],['geometrico','GEOMÉTRICO'],['difusor','DIFUSORES'],
              ['escultura','ESCULTURAS'],['diseno','DISEÑOS'],['ilustracion','ILUSTRACIONES']];

  const K='hk23_obras';
  const leer=()=>{ try{ return JSON.parse(localStorage.getItem(K))||[]; }catch(e){ return []; } };
  const guardar=()=>{ try{ localStorage.setItem(K,JSON.stringify(OBRAS)); return true; }catch(e){ return false; } };
  let OBRAS=leer(), cat='todo', idx=0;

  // la pieza que se ve mientras no cargaste ninguna: generada, y marcada como tal
  function relieveSemilla(n){
    const d=[];
    for(let r=0;r<n;r++){ d.push([]);
      for(let c=0;c<n;c++){
        const u=c/(n-1)-0.5, v=r/(n-1)-0.5;
        const rad=Math.hypot(u,v);
        const h=0.5+0.5*Math.sin(rad*13-Math.atan2(v,u)*3)*Math.exp(-rad*2.2);
        d[r].push(Math.max(0,Math.min(1,h)));
      } }
    return d;
  }
  const SEMILLA={ id:'demo', t:'RELIEVE 01', cat:'geometrico', mat:'generado', anio:'',
    nota:'Esta pieza no es tuya: la generé para que el taller no esté vacío. Subí una foto de una obra real y esto se reemplaza.',
    demo:true, n:26, depth:relieveSemilla(26), img:null, precio:'' };

  const lista=()=>{ const L=OBRAS.filter(o=>cat==='todo'||o.cat===cat);
    return L.length?L:(cat==='todo'?[SEMILLA]:[]); };

  // ── lienzo 3D ──
  const cv=$('ar-cv'), g=cv.getContext('2d');
  let W=0,H=0,DPR=1, rotY=-0.55, rotX=0.62, girando=false, px=0, py=0, corriendo=false, auto=true;
  function fit(){ const r=cv.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1);
    const w=Math.round(r.width*DPR), h=Math.round(r.height*DPR);
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
    W=cv.width; H=cv.height; }
  addEventListener('resize',fit);

  // proyección: giro en Y, inclinación en X, perspectiva
  function proyectar(x,y,z,esc,cx,cy){
    const cY=Math.cos(rotY), sY=Math.sin(rotY);
    let X=x*cY - z*sY, Z=x*sY + z*cY;
    const cX=Math.cos(rotX), sX=Math.sin(rotX);
    let Y=y*cX - Z*sX; Z=y*sX + Z*cX;
    const f=3.0/(3.0+Z);
    return { x:cx+X*esc*f, y:cy+Y*esc*f, z:Z, f };
  }
  const mezcla=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  const rgb=c=>'rgb('+c[0]+','+c[1]+','+c[2]+')';
  // paleta por material: la madera no se ve como el metal
  const PAL={ madera:[[62,40,24],[214,166,110]], geometrico:[[24,26,38],[210,224,246]],
    difusor:[[44,32,20],[226,196,142]], escultura:[[34,32,30],[224,220,214]],
    diseno:[[20,22,30],[232,200,106]], ilustracion:[[30,20,28],[236,180,200]], generado:[[26,24,34],[232,200,106]] };

  function pintar(ts){
    if(!corriendo) return;
    requestAnimationFrame(pintar);
    fit();
    g.fillStyle='#07060A'; g.fillRect(0,0,W,H);
    for(let i=0;i<90;i++){ const a=Math.sin(i*12.9898)*43758.5453, b=Math.sin(i*78.233)*12345.6789;
      const x=(a-Math.floor(a))*W, y=(b-Math.floor(b))*H, s=(Math.sin(i*3.17)+1)/2;
      g.globalAlpha=0.06+s*0.26; g.fillStyle='#EDE7DE';
      g.beginPath(); g.arc(x,y,Math.max(0.6,W*0.0006),0,TAUL); g.fill(); }
    g.globalAlpha=1;

    const L=lista(); if(!L.length){ ficha(null); return; }
    if(idx>=L.length) idx=0;
    const o=L[idx];
    if(auto && !girando) rotY += 0.00022;

    const n=o.n||26, D=o.depth||[];
    const esc=Math.min(W,H)*0.62;                 // la obra ocupa la pantalla
    const cx=W*0.5, cy=H*0.5;
    const cel=1.6/n;                              // la pieza mide 1.6 de lado
    const pal=PAL[o.cat]||PAL.generado;

    // cada celda es un bloque: eso ES un difusor, y eso ES tu arte geométrico
    const caras=[];
    for(let r=0;r<n;r++){ const fila=D[r]||[];
      for(let c=0;c<n;c++){
        const h=Math.max(0.02, fila[c]!=null?fila[c]:0.3);
        const x0=-0.8+c*cel, x1=x0+cel*0.92;
        const y0=-0.8+r*cel, y1=y0+cel*0.92;
        const z=-h*0.55;
        const p=[ proyectar(x0,y0,z,esc,cx,cy), proyectar(x1,y0,z,esc,cx,cy),
                  proyectar(x1,y1,z,esc,cx,cy), proyectar(x0,y1,z,esc,cx,cy) ];
        const zm=(p[0].z+p[1].z+p[2].z+p[3].z)/4;
        caras.push({p, zm, h, tipo:'tapa', c, r});
        // el costado que mira a la luz: le da volumen de verdad
        const q=[ proyectar(x0,y1,z,esc,cx,cy), proyectar(x1,y1,z,esc,cx,cy),
                  proyectar(x1,y1,0,esc,cx,cy), proyectar(x0,y1,0,esc,cx,cy) ];
        caras.push({p:q, zm:zm+0.001, h, tipo:'lado', c, r});
      } }
    caras.sort((a,b)=>b.zm-a.zm);                 // lo lejano primero

    caras.forEach(f=>{
      const t=Math.max(0,Math.min(1,f.h));
      let col=mezcla(pal[0],pal[1], f.tipo==='tapa'? 0.25+t*0.75 : 0.06+t*0.30);
      g.beginPath(); g.moveTo(f.p[0].x,f.p[0].y);
      for(let i=1;i<4;i++) g.lineTo(f.p[i].x,f.p[i].y);
      g.closePath(); g.fillStyle=rgb(col); g.fill();
      if(f.tipo==='tapa'){ g.strokeStyle='rgba(7,6,10,.45)'; g.lineWidth=Math.max(0.5,W*0.0004); g.stroke(); }
    });
    ficha(o);
  }
  const TAUL=Math.PI*2;

  function ficha(o){
    const el=$('ar-ficha'); if(!el) return;
    if(!o){ el.innerHTML='<b>SIN OBRAS EN ESTA CATEGORÍA</b>'+
      '<p>Subí una foto de una pieza tuya y aparece acá en 3D.</p>'; return; }
    const L=lista();
    el.innerHTML='<b>'+esc(o.t||'—')+'</b>'+
      '<i>'+esc((CATS.find(c=>c[0]===o.cat)||[,''])[1])+
      (o.mat?' · '+esc(o.mat):'')+(o.anio?' · '+esc(o.anio):'')+
      (L.length>1?' · '+(idx+1)+'/'+L.length:'')+'</i>'+
      (o.nota?'<p>'+esc(o.nota)+'</p>':'')+
      (o.precio?'<p style="color:#E8C86A">'+esc(o.precio)+'</p>':'')+
      (o.demo?'<span class="demo">NO ES TUYA · GENERADA</span>':'');
  }

  // girar con el dedo
  cv.addEventListener('pointerdown',e=>{ girando=true; px=e.clientX; py=e.clientY;
    cv.classList.add('girando'); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove',e=>{ if(!girando) return;
    rotY += (e.clientX-px)*0.006; rotX += (e.clientY-py)*0.004;
    rotX=Math.max(-1.3,Math.min(1.45,rotX)); px=e.clientX; py=e.clientY; });
  const soltar=()=>{ girando=false; cv.classList.remove('girando'); };
  cv.addEventListener('pointerup',soltar); cv.addEventListener('pointercancel',soltar);
  cv.addEventListener('dblclick',()=>{ const L=lista(); if(L.length>1){ idx=(idx+1)%L.length; } });

  // ── subir una obra: la foto se convierte en relieve 3D de verdad ──
  function avisar(t){ let el=$('ar-live');
    if(!el){ el=document.createElement('div'); el.id='ar-live'; el.setAttribute('aria-live','polite');
      el.style.cssText='position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)'; $('ar').appendChild(el); }
    el.textContent=t; }
  // el brillo de cada zona de la foto pasa a ser profundidad. Así se talla un relieve.
  function fotoARelieve(img, n){
    const oc=document.createElement('canvas'); oc.width=oc.height=n;
    const x=oc.getContext('2d', {willReadFrequently:true});
    const lado=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-lado)/2,(img.height-lado)/2,lado,lado,0,0,n,n);
    const d=x.getImageData(0,0,n,n).data, m=[];
    let min=1, max=0;
    for(let r=0;r<n;r++){ m.push([]);
      for(let c=0;c<n;c++){ const i=(r*n+c)*4;
        const l=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255;
        m[r].push(l); if(l<min)min=l; if(l>max)max=l; } }
    const rango=Math.max(0.08,max-min);
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) m[r][c]=(m[r][c]-min)/rango;   // estirar el contraste
    return m;
  }
  function subir(){
    $('ar-panel').innerHTML='<div class="ap-w">'+
      '<div class="ap-eye">◆ HK23ART</div><h3 class="ap-t">SUBÍ UNA OBRA TUYA</h3>'+
      '<div class="ap-drop" id="ap-drop">Tocá para elegir una foto de la pieza<br>'+
      '<span style="font-size:9px;letter-spacing:2px">SE TALLA EN 3D DESDE LA FOTO</span></div>'+
      '<input type="file" id="ap-file" accept="image/*" style="display:none">'+
      '<label class="ap-f"><span>TÍTULO</span><input id="ap-t" placeholder="cómo se llama"></label>'+
      '<label class="ap-f"><span>CATEGORÍA</span><select id="ap-c">'+
        CATS.filter(c=>c[0]!=='todo').map(c=>'<option value="'+c[0]+'">'+c[1]+'</option>').join('')+'</select></label>'+
      '<label class="ap-f"><span>MATERIAL</span><input id="ap-m" placeholder="raulí, MDF, resina…"></label>'+
      '<label class="ap-f"><span>AÑO</span><input id="ap-y" placeholder="2026"></label>'+
      '<label class="ap-f"><span>PRECIO — si la vendés</span><input id="ap-p" placeholder="$"></label>'+
      '<label class="ap-f"><span>NOTA</span><textarea id="ap-n" placeholder="qué es, de dónde salió"></textarea></label>'+
      '<p class="ap-note">La foto no sale de tu dispositivo: la leo acá mismo para calcular el relieve. '+
      'El brillo de cada zona pasa a ser profundidad — lo claro sobresale, lo oscuro se hunde. '+
      'Funciona mejor con una foto frontal y con luz pareja.</p>'+
      '<div class="ap-acts"><button class="ar-b on" id="ap-ok">＋ TALLARLA</button>'+
      '<button class="ar-b" id="ap-x">CANCELAR</button></div></div>';
    const P=$('ar-panel'); P.classList.add('open');
    let depth=null, n=30, nombreArch='';
    $('ap-drop').onclick=()=>$('ap-file').click();
    $('ap-file').onchange=e=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      nombreArch=f.name.replace(/\.[a-z0-9]+$/i,'');
      const fr=new FileReader();
      fr.onload=()=>{ const img=new Image();
        img.onload=()=>{ try{ depth=fotoARelieve(img,n);
            $('ap-drop').classList.add('hay');
            $('ap-drop').innerHTML='✓ '+esc(f.name)+'<br><span style="font-size:9px;letter-spacing:2px">RELIEVE CALCULADO — '+n+'×'+n+'</span>';
            if(!$('ap-t').value) $('ap-t').value=nombreArch.toUpperCase();
            avisar('Relieve calculado desde la foto.');
          }catch(err){ depth=null;
            $('ap-drop').innerHTML='✕ No pude leer esa imagen: '+esc(String(err.message||err).slice(0,60)); } };
        img.onerror=()=>{ depth=null; $('ap-drop').innerHTML='✕ Ese archivo no es una imagen que pueda abrir.'; };
        img.src=fr.result; };
      fr.onerror=()=>{ $('ap-drop').innerHTML='✕ No pude leer el archivo.'; };
      fr.readAsDataURL(f);
    };
    $('ap-x').onclick=()=>P.classList.remove('open');
    $('ap-ok').onclick=()=>{
      const t=($('ap-t').value||'').trim();
      if(!t){ avisar('Ponele un título.'); $('ap-t').focus(); return; }
      if(!depth){ $('ap-drop').innerHTML='✕ Falta la foto — sin foto no hay relieve que tallar.'; return; }
      const o={ id:'o'+Date.now().toString(36), t:t.toUpperCase(), cat:$('ap-c').value,
        mat:($('ap-m').value||'').trim(), anio:($('ap-y').value||'').trim(),
        precio:($('ap-p').value||'').trim(), nota:($('ap-n').value||'').trim(),
        n, depth, demo:false };
      OBRAS.push(o); const ok=guardar(); OBRAS=leer();
      const quedo=OBRAS.some(x=>x.id===o.id);
      P.classList.remove('open');
      if(quedo){ cat=o.cat; idx=0; pintarCats(); avisar('Obra tallada y guardada.'); log('arte','subió '+o.t); }
      else avisar('No se pudo guardar — la foto puede ser muy pesada para el navegador.');
    };
    setTimeout(()=>$('ap-drop').focus&&$('ap-drop').focus(),30);
  }

  function pintarCats(){
    const el=$('ar-cats'); if(!el) return;
    el.innerHTML=CATS.map(([k,l])=>{
      const n=k==='todo'?OBRAS.length:OBRAS.filter(o=>o.cat===k).length;
      return '<button class="ar-b'+(cat===k?' on':'')+'" data-c="'+k+'">'+esc(l)+
        (n?' <span style="opacity:.6">'+n+'</span>':'')+'</button>'; }).join('');
    el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ cat=b.dataset.c; idx=0; pintarCats(); });
  }

  let ultimo=null;
  function abrir(){ const el=$('ar'); if(el.classList.contains('open')) return;
    OBRAS=leer(); el.classList.add('open'); ultimo=document.activeElement;
    corriendo=true; fit(); pintarCats(); requestAnimationFrame(pintar);
    setTimeout(()=>{ const b=$('ar-close'); if(b) b.focus(); },30);
    log('arte','entró a HK23ART'); }
  function cerrar(){ const el=$('ar'); if(!el.classList.contains('open')) return;
    corriendo=false; el.classList.remove('open'); $('ar-panel').classList.remove('open');
    if(ultimo&&ultimo.focus) ultimo.focus(); ultimo=null; }
  $('ar-close').onclick=cerrar; $('ar-new').onclick=subir;
  addEventListener('keydown',e=>{
    if(/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')) return;
    if(!$('ar').classList.contains('open')) return;
    if(e.key==='Escape'){ e.stopImmediatePropagation();
      if($('ar-panel').classList.contains('open')) $('ar-panel').classList.remove('open'); else cerrar(); }
    if(e.key==='ArrowRight'){ const L=lista(); if(L.length>1) idx=(idx+1)%L.length; }
    if(e.key==='ArrowLeft'){ const L=lista(); if(L.length>1) idx=(idx-1+L.length)%L.length; }
  }, true);

  window.HK23Art={ open:abrir, close:cerrar, subir, obras:()=>JSON.parse(JSON.stringify(OBRAS)), version:'1' };
})();
</script>
