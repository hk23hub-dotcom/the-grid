<script>
// ═══ RUGBY VICE — la cancha con cosas pasando: mini agentes corren la jugada, el kicker patea ═══
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const log=(a,b)=>{ try{ (window.hkLog||function(){})(a,b); }catch(e){} };
  const TAU=Math.PI*2;
  const st={ get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } } };

  // ── la cancha: x lateral [-1,1] · z fondo [0..100] (metros). Postes en z=95. ──
  const cv=$('rv-cv'), g=cv.getContext('2d');
  let W=0,H=0,DPR=1, corriendo=false, t0=null;
  function fit(){ const r=cv.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1);
    const w=Math.round(r.width*DPR), h=Math.round(r.height*DPR);
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; } W=cv.width; H=cv.height; }
  addEventListener('resize',fit);
  function proy(x,z,alt){                       // perspectiva + altura (para la pelota en vuelo)
    const t=z/100, per=1-0.66*t;
    return { x: W/2 + x*(W*0.40)*per, y: H*0.80 - t*(H*0.56) - (alt||0)*(H*0.16)*per, per };
  }

  // ── LAS JUGADAS: cada jugador es un mini agente con su ruta ──
  // rutas: lista de [x,z] por jugador; la pelota viaja entre portadores (idx del jugador)
  const PLAYS=[
    { k:'crash', n:'CRASH BALL', d:'El 9 saca, el 12 entra derecho a romper la línea. Simple y honesta.',
      dur:5.2, rutas:[ [[-0.10,38],[-0.06,40],[0,42]], [[-0.30,36],[-0.18,44],[-0.02,52]],
        [[0.15,36],[0.15,40],[0.12,46]], [[0.42,34],[0.40,40],[0.38,44]] ],
      pelota:[[0,0],[1,1.6],[1,5.2]] },
    { k:'loop', n:'LOOP 10-12', d:'El 10 pasa al 12 y lo envuelve por afuera: sobra un hombre.',
      dur:6.0, rutas:[ [[-0.12,38],[-0.02,42],[0.18,48],[0.34,54]], [[0.06,36],[0.10,42],[0.14,46]],
        [[0.30,34],[0.34,42],[0.44,50]], [[-0.35,36],[-0.30,42],[-0.26,46]] ],
      pelota:[[0,0],[1,1.8],[0,3.4],[2,6.0]] },
    { k:'blind', n:'LADO CIEGO', d:'Todos miran al abierto; el 9 y el wing atacan el ciego.',
      dur:5.6, rutas:[ [[0.05,38],[-0.12,40],[-0.34,46],[-0.52,54]], [[-0.45,36],[-0.48,44],[-0.50,52]],
        [[0.25,36],[0.30,40],[0.36,44]], [[0.50,34],[0.52,38],[0.55,42]] ],
      pelota:[[0,0],[0,2.4],[1,5.6]] }
  ];
  let play=PLAYS[0], playT=0, modo='jugada';

  // ── EL KICKER: arrastrás, soltás, la pelota vuela a los postes ──
  const K={ bola:null, spot:{x:0,z:62}, res:'', marca:st.get('hk23_rv_kicks',{m:0,a:0}) };
  let arrastre=null;
  function patear(dx,dy){
    const f=Math.hypot(dx,dy)/(H*0.30);
    K.bola={ x:K.spot.x, z:K.spot.z, alt:0,
      vx:(-dx/(W*0.30))*1.1, vz:Math.min(1.3,f)*34, valt:Math.min(1.3,f)*2.6, t:0 };
    K.res='';
  }
  function fisicaKick(dt){
    const b=K.bola; if(!b) return;
    b.t+=dt; b.x+=b.vx*dt*0.5; b.z+=b.vz*dt; b.alt+=b.valt*dt; b.valt-=3.4*dt;
    if(b.z>=95 && b.z-b.vz*dt<95){                       // cruza el plano de los postes
      const dentro=Math.abs(b.x)<0.16 && b.alt>0.18;     // entre palos y sobre el travesaño
      K.res=dentro?'¡ENTRE LOS PALOS!':'AFUERA';
      K.marca.a++; if(dentro) K.marca.m++;
      st.set('hk23_rv_kicks',K.marca); hud();
    }
    if(b.alt<=0 && b.valt<0){ K.bola=null; if(!K.res){ K.res='CORTA'; K.marca.a++; st.set('hk23_rv_kicks',K.marca); hud(); }
      setTimeout(()=>{ K.res=''; },1200); }
  }
  cv.addEventListener('pointerdown',e=>{ if(modo!=='kicker'||K.bola) return;
    const r=cv.getBoundingClientRect(); const pb=proy(K.spot.x,K.spot.z,0);
    const sx=(e.clientX-r.left)*(W/r.width), sy=(e.clientY-r.top)*(H/r.height);
    if(Math.hypot(sx-pb.x,sy-pb.y)<Math.max(44*DPR,W*0.07)){ arrastre={x0:sx,y0:sy,dx:0,dy:0};
      cv.setPointerCapture(e.pointerId); } });
  cv.addEventListener('pointermove',e=>{ if(!arrastre) return;
    const r=cv.getBoundingClientRect();
    arrastre.dx=(e.clientX-r.left)*(W/r.width)-arrastre.x0;
    arrastre.dy=(e.clientY-r.top)*(H/r.height)-arrastre.y0; });
  cv.addEventListener('pointerup',()=>{ if(!arrastre) return;
    if(Math.hypot(arrastre.dx,arrastre.dy)>H*0.03) patear(arrastre.dx,arrastre.dy);
    arrastre=null; });
